name: Release

# Builds a signed APK and creates a DRAFT release in the public release repository.
# Nothing is published until a maintainer reviews the draft and clicks "Publish" on GitHub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (must match noor.versionName, e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Configure required reviewers for this environment in Settings → Environments.
    environment: release
    env:
      RELEASES_REPO: ${{ vars.NOOR_RELEASES_REPO || 'Koptan919/noor-releases' }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check version matches the project
        run: |
          expected="v$(grep '^noor.versionName=' gradle.properties | cut -d= -f2)"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::Input $VERSION does not match gradle.properties ($expected)"; exit 1
          fi

      - name: Tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Restore signing key
        env:
          NOOR_KEYSTORE_BASE64: ${{ secrets.NOOR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NOOR_KEYSTORE_BASE64" ]; then echo "::error::Signing secret NOOR_KEYSTORE_BASE64 is not configured"; exit 1; fi
          echo "$NOOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noor-release.jks"
          echo "NOOR_KEYSTORE_FILE=$RUNNER_TEMP/noor-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          NOOR_KEYSTORE_PASSWORD: ${{ secrets.NOOR_KEYSTORE_PASSWORD }}
          NOOR_KEY_ALIAS: ${{ secrets.NOOR_KEY_ALIAS }}
          NOOR_KEY_PASSWORD: ${{ secrets.NOOR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify APK signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/noor-${VERSION}.apk"
          (cd dist && sha256sum "noor-${VERSION}.apk" > "noor-${VERSION}.apk.sha256")

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/noor-release.jks"

      - name: Release notes
        run: |
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "## Noor ${VERSION}"
            echo
            echo "### Changes"
            if [ -n "$previous" ]; then git log --no-merges --pretty='- %s' "$previous"..HEAD; else git log --no-merges --pretty='- %s' -n 30; fi
            echo
            echo "### Verify your download"
            echo '```'
            cat "dist/noor-${VERSION}.apk.sha256"
            echo '```'
            echo
            echo "Updating keeps your favourites, reading progress and settings."
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noor-${{ inputs.version }}
          path: dist/

      - name: Create DRAFT release in the public repository
        env:
          GH_TOKEN: ${{ secrets.NOOR_RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::NOOR_RELEASES_TOKEN not set; skipping draft release (artifacts are attached to this run)."; exit 0; fi
          gh release create "$VERSION" \
            --repo "$RELEASES_REPO" \
            --draft \
            --title "Noor ${VERSION}" \
            --notes-file dist/RELEASE_NOTES.md \
            "dist/noor-${VERSION}.apk" "dist/noor-${VERSION}.apk.sha256"
          echo "Draft created in $RELEASES_REPO. Review it on GitHub and click Publish when approved."
