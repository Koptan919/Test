org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- App identity (change these to rename the app) ----
noor.appName=Noor
# Arabic name as Unicode escapes (gradle.properties is read as ISO-8859-1). \u0646\u0648\u0631 = نور
noor.appNameArabic=\u0646\u0648\u0631
noor.applicationId=com.noor.app
noor.versionCode=4
noor.versionName=0.2.2

# Public repository whose GitHub Releases host approved APKs (tags vX.Y.Z) and content packs
# (tags content-*). Chosen by the user on 2026-11-19: this repository.
noor.releasesRepo=Koptan919/Test
